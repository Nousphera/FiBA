[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiba-benchmark"
version = "0.1.0"
description = "Recovered FiBA federated backdoor research benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "Matthijs Marinus"}, {name = "Vasileios Tsouvalas"}]
dependencies = [
  "flwr==1.13.1", "torch==2.6.0", "torchvision==0.21.0",
  "torchmetrics==1.6.1", "numpy==1.26.4", "scikit-learn==1.6.1",
  "torchcam==0.4.0", "opencv-python-headless==4.11.0.86",
  "matplotlib>=3.7,<4", "click<8.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "build>=1,<2", "lpips==0.1.4"]
metrics = ["lpips==0.1.4"]

[project.scripts]
fiba = "fiba.main:cli"

[project.urls]
Repository = "https://github.com/Nousphera/FiBA"
Paper = "https://doi.org/10.1007/978-981-96-4836-8_13"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "nousphera"

[tool.flwr.app.components]
serverapp = "fiba.server_app:app"
clientapp = "fiba.client_app:app"

[tool.flwr.app.config]
options = "--dataset synthetic --num-clients 2 --num-rounds 2 --local-epochs 1 --batch-size 4 --target-class 1 --attacker-fraction 0.5 --output runs/flower-smoke"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
options.backend.init-args.num-cpus = 1

[tool.flwr.federations.paper]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
options.backend.init-args.num-cpus = 1
